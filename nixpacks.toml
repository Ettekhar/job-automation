[phases.setup]
nixPkgs = [
  "nodejs_20",
  "playwright-driver",
  "chromium",
  "glibc",
  "nss",
  "nspr",
  "dbus",
  "atk",
  "cups",
  "libxkbcommon",
  "xorg.libXcomposite",
  "xorg.libXdamage",
  "xorg.libXext",
  "xorg.libXfixes",
  "xorg.libXrandr",
  "mesa",
  "pango",
  "cairo",
  "alsa-lib"
]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npx playwright install chromium --with-deps || true"]

[start]
cmd = "node server.mjs"
