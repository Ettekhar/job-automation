<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0e1a">
  <title>Sign In — Teletalk Job Radar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep: #040710;
      --bg-base: #0a0e1a;
      --bg-card: rgba(15, 20, 40, 0.85);
      --border: rgba(99, 102, 241, 0.18);
      --indigo: #6366f1;
      --violet: #8b5cf6;
      --cyan: #06b6d4;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --error: #f87171;
      --success: #34d399;
    }

    html, body {
      height: 100%;
      background: var(--bg-deep);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      color: var(--text-primary);
      overflow: hidden;
    }

    /* ── Animated background ── */
    .bg-canvas {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(99,102,241,0.18) 0%, transparent 70%),
                  radial-gradient(ellipse 50% 50% at 85% 70%, rgba(139,92,246,0.12) 0%, transparent 60%),
                  radial-gradient(ellipse 40% 40% at 10% 80%, rgba(6,182,212,0.08) 0%, transparent 55%);
      animation: bgPulse 8s ease-in-out infinite alternate;
    }
    @keyframes bgPulse {
      from { opacity: 0.8; }
      to { opacity: 1; }
    }

    /* ── Grid lines ── */
    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(99,102,241,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* ── Floating orbs ── */
    .orb {
      position: fixed; border-radius: 50%;
      filter: blur(80px); opacity: 0.15;
      animation: float 12s ease-in-out infinite;
      z-index: 0; pointer-events: none;
    }
    .orb-1 { width: 400px; height: 400px; background: var(--indigo); top: -120px; left: -100px; animation-delay: 0s; }
    .orb-2 { width: 300px; height: 300px; background: var(--violet); bottom: -80px; right: -80px; animation-delay: -4s; }
    .orb-3 { width: 200px; height: 200px; background: var(--cyan); bottom: 30%; left: 30%; animation-delay: -8s; }
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -20px) scale(1.05); }
      66% { transform: translate(-20px, 15px) scale(0.95); }
    }

    /* ── Main layout ── */
    .login-container {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }

    /* ── Card ── */
    .login-card {
      width: 100%; max-width: 420px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 36px;
      backdrop-filter: blur(24px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04),
        0 4px 6px -1px rgba(0,0,0,0.4),
        0 24px 60px -8px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.06);
      animation: cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Logo / brand ── */
    .brand {
      display: flex; flex-direction: column; align-items: center;
      margin-bottom: 32px; gap: 12px;
    }
    .logo-wrap {
      position: relative; width: 64px; height: 64px;
    }
    .logo-ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 2px solid transparent;
      background: linear-gradient(135deg, var(--indigo), var(--violet)) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: destination-out;
      mask-composite: exclude;
      animation: spin 8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .logo-inner {
      position: absolute; inset: 8px; border-radius: 50%;
      background: linear-gradient(135deg, rgba(99,102,241,0.3), rgba(139,92,246,0.3));
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    .brand-name {
      font-size: 22px; font-weight: 800; letter-spacing: -0.5px;
      background: linear-gradient(135deg, #a5b4fc, #c4b5fd, #67e8f9);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .brand-tagline {
      font-size: 13px; color: var(--text-muted); font-weight: 500;
    }

    /* ── Section heading ── */
    .section-title {
      text-align: center; font-size: 17px; font-weight: 700;
      color: var(--text-primary); margin-bottom: 20px;
    }
    .section-sub {
      text-align: center; font-size: 13px; color: var(--text-muted);
      margin-top: -14px; margin-bottom: 22px;
    }

    /* ── Google button ── */
    .btn-google {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      width: 100%; padding: 14px 20px;
      background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px; cursor: pointer;
      font-family: inherit; font-size: 15px; font-weight: 600;
      color: var(--text-primary); text-decoration: none;
      transition: all 0.2s ease;
      position: relative; overflow: hidden;
    }
    .btn-google::before {
      content: '';
      position: absolute; inset: 0; border-radius: 14px;
      background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(139,92,246,0.1));
      opacity: 0; transition: opacity 0.2s ease;
    }
    .btn-google:hover::before { opacity: 1; }
    .btn-google:hover {
      border-color: rgba(99,102,241,0.4);
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(99,102,241,0.2);
    }
    .btn-google:active { transform: translateY(0); }
    .btn-google svg { flex-shrink: 0; position: relative; z-index: 1; }
    .btn-google span { position: relative; z-index: 1; }

    /* ── Divider ── */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 24px 0; color: var(--text-muted); font-size: 12px; font-weight: 500;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1;
      height: 1px; background: rgba(148,163,184,0.15);
    }

    /* ── Form ── */
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px;
      margin-bottom: 7px;
    }
    .form-input {
      width: 100%; padding: 12px 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(99,102,241,0.2);
      border-radius: 12px; outline: none;
      font-family: inherit; font-size: 14px; color: var(--text-primary);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input::placeholder { color: rgba(148,163,184,0.45); }
    .form-input:focus {
      border-color: var(--indigo);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
      background: rgba(99,102,241,0.05);
    }

    /* ── Submit button ── */
    .btn-submit {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--indigo), var(--violet));
      border: none; border-radius: 14px; cursor: pointer;
      font-family: inherit; font-size: 15px; font-weight: 700;
      color: #fff; letter-spacing: 0.2px;
      transition: all 0.2s ease;
      position: relative; overflow: hidden;
      margin-top: 8px;
    }
    .btn-submit::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(99,102,241,0.45);
    }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit.loading { pointer-events: none; opacity: 0.7; }

    /* ── Error / success alert ── */
    .alert {
      display: none; padding: 12px 16px;
      border-radius: 12px; font-size: 13px; font-weight: 500;
      margin-bottom: 16px; animation: alertIn 0.3s ease;
    }
    @keyframes alertIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .alert.error {
      display: block;
      background: rgba(248,113,113,0.12);
      border: 1px solid rgba(248,113,113,0.3);
      color: var(--error);
    }
    .alert.success {
      display: block;
      background: rgba(52,211,153,0.1);
      border: 1px solid rgba(52,211,153,0.25);
      color: var(--success);
    }

    /* ── Footer ── */
    .login-footer {
      text-align: center; margin-top: 24px;
      font-size: 12px; color: rgba(148,163,184,0.5);
    }

    /* ── Google not configured notice ── */
    .google-disabled-note {
      display: none;
      text-align: center; font-size: 12px;
      color: rgba(148,163,184,0.5); padding: 8px;
      border: 1px dashed rgba(99,102,241,0.2);
      border-radius: 10px; background: rgba(99,102,241,0.04);
    }
  </style>
</head>
<body>

<div class="bg-canvas"></div>
<div class="bg-grid"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="login-container">
  <div class="login-card">
    <!-- Brand -->
    <div class="brand">
      <div class="logo-wrap">
        <div class="logo-ring"></div>
        <div class="logo-inner">📡</div>
      </div>
      <div class="brand-name">Teletalk Job Radar</div>
      <div class="brand-tagline">Automated Government CSE/IT Tracker</div>
    </div>

    <!-- Alert area -->
    <div class="alert" id="alertMsg" role="alert"></div>

    <!-- Google Sign-In -->
    <div class="section-title">Welcome back</div>
    <div class="section-sub">Sign in to access your dashboard</div>

    <!-- Google OAuth button -->
    <a href="/api/auth/google" class="btn-google" id="btnGoogle">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      <span>Continue with Google</span>
    </a>

    <p class="google-disabled-note" id="googleDisabledNote">
      ⚙️ Google login requires GOOGLE_CLIENT_ID in .env. Using local login below.
    </p>

    <!-- Divider -->
    <div class="divider">or sign in with password</div>

    <!-- Local login form -->
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input class="form-input" type="text" id="username" name="username"
               placeholder="your username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" name="password"
               placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-submit" id="btnSubmit">
        Sign In
      </button>
    </form>

    <div class="login-footer">
      Teletalk Job Radar &mdash; Private Dashboard &copy; 2026
    </div>
  </div>
</div>

<script>
  // Check if Google is configured
  fetch('/api/auth/status').then(r => r.json()).then(data => {
    if (!data.googleConfigured) {
      document.getElementById('btnGoogle').style.display = 'none';
      document.getElementById('googleDisabledNote').style.display = 'block';
    }
    // If already logged in, redirect
    if (data.user) window.location.href = '/';
  }).catch(() => {});

  // Redirect from ?error
  const params = new URLSearchParams(window.location.search);
  if (params.get('error') === 'not_allowed') {
    showAlert('error', 'Your Google account is not authorized to access this dashboard.');
  } else if (params.get('error') === 'oauth_failed') {
    showAlert('error', 'Google sign-in failed. Please try again.');
  } else if (params.get('error') === 'invalid_credentials') {
    showAlert('error', 'Invalid username or password. Please try again.');
  }

  function showAlert(type, msg) {
    const el = document.getElementById('alertMsg');
    el.className = 'alert ' + type;
    el.textContent = msg;
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnSubmit');
    btn.textContent = 'Signing in...';
    btn.classList.add('loading');

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (data.success) {
        showAlert('success', 'Signed in! Redirecting...');
        setTimeout(() => window.location.href = '/', 700);
      } else {
        showAlert('error', data.error || 'Invalid credentials.');
        btn.textContent = 'Sign In';
        btn.classList.remove('loading');
      }
    } catch (err) {
      showAlert('error', 'Network error. Is the server running?');
      btn.textContent = 'Sign In';
      btn.classList.remove('loading');
    }
  });
</script>
</body>
</html>
